<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D MIDI Rhythm Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .ui-sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            pointer-events: auto;
            width: fit-content;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: #222;
            height: 4px;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 사이드바 UI: 텍스트 제거 및 업로드 버튼 중심 구성 -->
    <div class="ui-sidebar space-y-3">
        <!-- 업로드 버튼 -->
        <div class="relative">
            <input type="file" id="midi-upload" accept=".mid,.midi" class="hidden">
            <label for="midi-upload"
                class="group flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-2xl cursor-pointer transition-all active:scale-95 shadow-xl shadow-blue-900/40 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" x2="12" y1="3" y2="15" />
                </svg>
                <span class="tracking-tight"></span>
            </label>
        </div>

        <!-- 컨트롤러: 파일 로드 후에만 나타남 -->
        <div id="controls"
            class="hidden bg-black/60 p-4 rounded-2xl border border-white/10 backdrop-blur-xl text-white shadow-2xl space-y-4">
            <button id="play-btn"
                class="w-full bg-white text-black hover:bg-gray-200 py-2.5 rounded-xl font-bold transition-all active:scale-95 flex items-center justify-center gap-2 text-sm">
                <span id="play-icon">▶</span>
                <span id="play-text">시작</span>
            </button>

            <div class="space-y-2">
                <div class="flex items-center justify-between text-[10px] text-gray-400 uppercase font-black px-1">
                    <span>Speed</span>
                    <span id="speed-val" class="text-blue-400">1.0x</span>
                </div>
                <input type="range" id="speed-slider" min="0.5" max="5" step="0.1" value="1" class="w-full">
            </div>
        </div>
    </div>

    <!-- 로딩 인디케이터 -->
    <div id="loading" class="loading-overlay">
        <div class="w-10 h-10 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-sm font-medium">데이터 분석 중...</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 3D 및 물리 설정 ---
        const LANE_WIDTH = 100;
        const KEY_COUNT = 88;
        const START_NOTE = 21;
        const NOTE_WIDTH = LANE_WIDTH / KEY_COUNT;
        const SCROLL_SPEED = 50;
        const JUDGMENT_LINE_Z = 45;

        let scene, camera, renderer, clock;
        let midiData = null;
        let isPlaying = false;
        let playbackTime = 0;
        let noteMeshes = [];
        let judgmentLine, judgmentGlow;
        let speedMultiplier = 1;

        const colors = [0x00d9ff, 0xff0066, 0x00ff88, 0x7700ff, 0xffcc00];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.Fog(0x020204, 150, 500);

            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 60;
            camera = new THREE.OrthographicCamera(-viewSize * aspect, viewSize * aspect, viewSize, -viewSize, 1, 1000);
            camera.position.set(0, 100, 0);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const pointLight = new THREE.PointLight(0x3b82f6, 1.5, 200);
            pointLight.position.set(0, 30, JUDGMENT_LINE_Z);
            scene.add(pointLight);

            createStage();

            clock = new THREE.Clock();
            animate();

            window.addEventListener('resize', onWindowResize);
        }

        function createStage() {
            const lineGeo = new THREE.BoxGeometry(LANE_WIDTH, 0.5, 0.5);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            judgmentLine = new THREE.Mesh(lineGeo, lineMat);
            judgmentLine.position.set(0, 0, JUDGMENT_LINE_Z);
            scene.add(judgmentLine);

            const glowGeo = new THREE.PlaneGeometry(LANE_WIDTH, 15);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x0033ff,
                transparent: true,
                opacity: 0.1,
                side: THREE.DoubleSide
            });
            judgmentGlow = new THREE.Mesh(glowGeo, glowMat);
            judgmentGlow.rotation.x = Math.PI / 2;
            judgmentGlow.position.set(0, -0.2, JUDGMENT_LINE_Z + 7);
            scene.add(judgmentGlow);

            const grid = new THREE.GridHelper(LANE_WIDTH, 20, 0x111122, 0x0a0a15);
            grid.position.set(0, -0.5, 0);
            scene.add(grid);
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const midi = new Midi(e.target.result);
                    processMidi(midi);
                    loading.style.display = 'none';
                    document.getElementById('controls').classList.remove('hidden');
                    isPlaying = false;
                    updatePlayUI();
                } catch (err) {
                    loading.style.display = 'none';
                    alert("MIDI 파일을 처리하는 중 오류가 발생했습니다.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function processMidi(midi) {
            noteMeshes.forEach(m => scene.remove(m));
            noteMeshes = [];
            playbackTime = 0;
            midiData = midi;

            midi.tracks.forEach((track, idx) => {
                const trackColor = colors[idx % colors.length];
                track.notes.forEach(note => {
                    const duration = note.duration;
                    const startTime = note.time;
                    const height = duration * SCROLL_SPEED;

                    const geometry = new THREE.BoxGeometry(NOTE_WIDTH * 0.85, 1, height);
                    const material = new THREE.MeshStandardMaterial({
                        color: trackColor,
                        emissive: trackColor,
                        emissiveIntensity: 0.2,
                        transparent: true,
                        opacity: 0.8
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    const xPos = ((note.midi - START_NOTE) * NOTE_WIDTH) - (LANE_WIDTH / 2);
                    const zPos = JUDGMENT_LINE_Z - (startTime * SCROLL_SPEED) - (height / 2);

                    mesh.position.set(xPos, 0.5, zPos);
                    mesh.userData = { startTime, endTime: startTime + duration, initialZ: zPos, color: trackColor };

                    scene.add(mesh);
                    noteMeshes.push(mesh);
                });
            });
        }

        function updatePlayUI() {
            const btn = document.getElementById('play-btn');
            const icon = document.getElementById('play-icon');
            const text = document.getElementById('play-text');
            icon.innerText = isPlaying ? "⏸" : "▶";
            text.innerText = isPlaying ? "일시정지" : "시작";
            btn.className = isPlaying
                ? "w-full bg-red-500/10 text-red-500 border border-red-500/50 hover:bg-red-500/20 py-2.5 rounded-xl font-bold transition-all flex items-center justify-center gap-2 text-sm"
                : "w-full bg-white text-black hover:bg-gray-200 py-2.5 rounded-xl font-bold transition-all flex items-center justify-center gap-2 text-sm";
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 60;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isPlaying && midiData) {
                playbackTime += delta * speedMultiplier;

                noteMeshes.forEach(mesh => {
                    const currentZ = mesh.userData.initialZ + (playbackTime * SCROLL_SPEED);
                    mesh.position.z = currentZ;

                    const halfHeight = ((mesh.userData.endTime - mesh.userData.startTime) * SCROLL_SPEED / 2);
                    const isHitting = (JUDGMENT_LINE_Z >= currentZ - halfHeight && JUDGMENT_LINE_Z <= currentZ + halfHeight);

                    if (isHitting) {
                        mesh.material.emissiveIntensity = 2.5;
                        mesh.position.y = 1.5;
                    } else {
                        mesh.material.emissiveIntensity = 0.2;
                        mesh.position.y = 0.5;
                    }

                    mesh.visible = (mesh.position.z > -150 && mesh.position.z < 150);
                });

                judgmentLine.material.opacity = 0.6 + Math.sin(playbackTime * 15) * 0.4;
            }

            renderer.render(scene, camera);
        }

        document.getElementById('midi-upload').addEventListener('change', handleFileUpload);
        document.getElementById('play-btn').addEventListener('click', () => {
            isPlaying = !isPlaying;
            updatePlayUI();
        });
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = speedMultiplier.toFixed(1) + "x";
        });

        window.onload = init;
    </script>
</body>

</html>
